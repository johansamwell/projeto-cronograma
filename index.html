      <div id="card-expandido" class="relative bg-white text-gray-900 rounded-2xl shadow-2xl max-w-xl w-[90%] p-8">
        <button onclick="fecharCard()" class="absolute top-4 right-4 text-gray-500 hover:text-red-500 text-xl font-bold">✕</button>
        <h3 id="titulo-expandido" class="text-2xl font-bold mb-4"></h3>
        <p class="text-base leading-relaxed mb-6">Conteúdo detalhado será exibido aqui com base no tema escolhido.</p>

<!-- ✅ Checklist Inteligente por Dia -->
<div id="checklist-diario" class="mt-4 space-y-2 text-gray-900">
  <label class="flex items-center space-x-2">
    <input type="checkbox" id="check-leitura" class="accent-green-600">
    <span>✔ Li o conteúdo</span>
  </label>
  <label class="flex items-center space-x-2">
    <input type="checkbox" id="check-questoes" class="accent-green-600">
    <span>✔ Resolvi questões</span>
  </label>
  <label class="flex items-center space-x-2">
    <input type="checkbox" id="check-revisao" class="accent-green-600">
    <span>✔ Fiz revisão</span>
  </label>
  <textarea id="notas-dia" rows="3" class="w-full p-2 rounded border mt-2" placeholder="📝 Notas pessoais..."></textarea>
</div>

        <button id="botao-realizado" onclick="marcarComoRealizado()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg shadow transition">
          ✔ Marcar como realizado
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    const dataProva = new Date("2025-06-22");
    const hoje = new Date();
    const diasRestantes = Math.floor((dataProva - hoje) / (1000 * 60 * 60 * 24));
    const diaHoje = 56 - diasRestantes;
    const contador = document.getElementById("contador-prova");
    contador.textContent = `Faltam ${diasRestantes} dias para a sua prova`;

    if (diaHoje >= 1 && diaHoje <= 56) {
     window.addEventListener('load', () => {
  const card = document.getElementById(`dia-${diaHoje}`);
  const container = document.getElementById("container-dias");
  if (card && container) {
    card.classList.add("bg-blue-600", "text-white", "shadow-xl", "scale-105");
    const cardOffset = card.offsetLeft - container.offsetWidth / 2 + card.offsetWidth / 2;
    container.scrollLeft = cardOffset;
  }
  atualizarProgresso();
  marcarCardsConcluidos();
  destacarDiasAtrasados();
  destacarRevisoesAgendadas();
});


    }

    function scrollContainer(dir) {
      document.getElementById("container-dias").scrollBy({
        left: dir * 300,
        behavior: 'smooth'
      });
    }

    let diaAtualExpandido = null;

function filtrarPorTema(tema) {
  const termo = tema.toLowerCase();
  const container = document.getElementById("container-dias");

  let algumVisivel = false;

  for (let i = 1; i <= 56; i++) {
    const card = document.getElementById(`dia-${i}`);
    const temasDoCard = card.getAttribute("data-tema") || "";
    const deveMostrar = !termo || temasDoCard.includes(termo);

    if (deveMostrar) {
      card.classList.remove('hidden');
      card.classList.add('card-animado');
      algumVisivel = true;
    } else {
      card.classList.add('hidden');
      card.classList.remove('card-animado');
    }
  }

  // Troca o layout se houver filtro
  if (termo && algumVisivel) {
    container.classList.add('modo-coluna');
  } else {
    container.classList.remove('modo-coluna');
  }
}


function mostrarConteudo(dia) {
  diaAtualExpandido = dia;

	carregarChecklist(dia);

	document.getElementById('check-leitura').onchange = () => salvarChecklist(dia);
	document.getElementById('check-questoes').onchange = () => salvarChecklist(dia);
	document.getElementById('check-revisao').onchange = () => salvarChecklist(dia);
	document.getElementById('notas-dia').oninput = () => salvarChecklist(dia);


  document.getElementById('overlay-card').classList.remove('hidden');
  document.getElementById('titulo-expandido').textContent = `Dia ${String(dia).padStart(2, '0')}`;
  document.querySelector('#card-expandido p').innerHTML = conteudos[dia - 1];

  const botao = document.getElementById('botao-realizado');
  const concluido = localStorage.getItem(`dia-${dia}`) === 'true';

  if (concluido) {
    botao.textContent = '✅ Tarefa concluída';
    botao.classList.remove('bg-green-600');
    botao.classList.add('bg-gray-400');
  } else {
    botao.textContent = '✔ Marcar como realizado';
    botao.classList.remove('bg-gray-400');
    botao.classList.add('bg-green-600');
  }
}


function marcarComoRealizado() {
  if (!diaAtualExpandido) return;

  const key = `dia-${diaAtualExpandido}`;
  const jaConcluido = localStorage.getItem(key) === 'true';

  if (jaConcluido) {
    localStorage.removeItem(key);
  } else {
    localStorage.setItem(key, true);
  }

  mostrarConteudo(diaAtualExpandido); // atualiza visual do botão
  marcarCardsConcluidos();
  atualizarProgresso();
}

function destacarDiasAtrasados() {
  for (let i = 1; i < diaHoje; i++) {
    const card = document.getElementById(`dia-${i}`);
    const concluido = localStorage.getItem(`dia-${i}`) === 'true';
    if (!concluido) {
      card.classList.add('border-2', 'border-red-500');
    } else {
      card.classList.remove('border-2', 'border-red-500');
    }
  }
}

function destacarRevisoesAgendadas() {
  for (let i = 1; i <= 56; i++) {
    const conteudo = conteudos[i - 1];
    const card = document.getElementById(`dia-${i}`);
    if (conteudo.includes('Revisão 7d') || conteudo.includes('Revisão 14d') || conteudo.includes('Revisão 21d')) {
      const marcador = document.createElement('div');
      marcador.className = "absolute bottom-2 right-2 text-yellow-400 text-lg";
      marcador.textContent = '🔁';
      card.appendChild(marcador);
    }
  }
}

    function marcarCardsConcluidos() {
      for (let i = 1; i <= 56; i++) {
        const card = document.getElementById(`dia-${i}`);
        const check = document.getElementById(`check-${i}`);
        if (localStorage.getItem(`dia-${i}`) === 'true') {
          card.classList.add('bg-green-700');
          check.classList.remove('hidden');
        } else {
          card.classList.remove('bg-green-700');
          check.classList.add('hidden');
        }
      }
    }

    function atualizarProgresso() {
      let concluidos = 0;
      for (let i = 1; i <= 56; i++) {
        if (localStorage.getItem(`dia-${i}`) === 'true') concluidos++;
      }
      const percentual = Math.round((concluidos / 56) * 100);
      document.getElementById('progresso-geral').textContent = `Progresso: ${percentual}% concluído`;
    }

    function fecharCard() {
      document.getElementById('overlay-card').classList.add('hidden');
    }
  </script>

<!-- 3. Por fim, o script da revisão automática -->
<script>
  window.addEventListener('load', () => {
    const conteudoHoje = conteudos[diaHoje - 1] || "";
    const revisaoHoje = ["revisão 7d", "revisão 14d", "revisão 21d"];

    const temRevisaoHoje = revisaoHoje.some(revisao =>
      conteudoHoje.toLowerCase().includes(revisao)
    );

    if (temRevisaoHoje) {
      mostrarConteudo(diaHoje);

      setTimeout(() => {
        const overlay = document.getElementById("overlay-card");
        const card = document.getElementById("card-expandido");
        const titulo = document.getElementById("titulo-expandido");

        if (overlay && card && titulo) {
          overlay.classList.add("animate-fadeIn");
          card.classList.add("bg-yellow-100", "border", "border-yellow-300", "rounded-2xl", "shadow-2xl", "animate-slideUp");
          titulo.classList.add("text-yellow-800", "text-3xl", "font-extrabold");
          titulo.innerHTML = "🔁 Dia de Revisão";
        }
      }, 300);
    }
  });
</script>

<script>
function atualizarProgresso() {
  let concluídos = 0;
  for (let i = 1; i <= 56; i++) {
    if (localStorage.getItem(`dia-${i}`) === "true") {
      concluídos++;
    }
  }
  document.getElementById("progresso-contador").textContent = concluídos;
}

// Atualiza ao carregar a página e ao marcar um dia como realizado
window.addEventListener("load", atualizarProgresso);
document.addEventListener("mudou-conclusao", atualizarProgresso);
</script>

<script>
function marcarPendencias() {
  const diaHoje = parseInt(localStorage.getItem("dia-atual")) || 1;

  for (let i = 1; i <= 56; i++) {
    const card = document.querySelector(`[data-dia='${i}']`);
    const feito = localStorage.getItem(`dia-${i}`) === "true";

    if (card) {
      if (!feito && i < diaHoje) {
        card.classList.add("dia-pendente");
      } else {
        card.classList.remove("dia-pendente");
      }
    }
  }
}

window.addEventListener("load", marcarPendencias);
document.addEventListener("mudou-conclusao", marcarPendencias);
</script>

<script>
function carregarChecklist(dia) {
  document.getElementById('check-leitura').checked = localStorage.getItem(`leitura-${dia}`) === "true";
  document.getElementById('check-questoes').checked = localStorage.getItem(`questoes-${dia}`) === "true";
  document.getElementById('check-revisao').checked = localStorage.getItem(`revisao-${dia}`) === "true";
  document.getElementById('notas-dia').value = localStorage.getItem(`notas-${dia}`) || "";
}

function salvarChecklist(dia) {
  localStorage.setItem(`leitura-${dia}`, document.getElementById('check-leitura').checked);
  localStorage.setItem(`questoes-${dia}`, document.getElementById('check-questoes').checked);
  localStorage.setItem(`revisao-${dia}`, document.getElementById('check-revisao').checked);
  localStorage.setItem(`notas-${dia}`, document.getElementById('notas-dia').value);
}
</script>

<script>
function filtrarRevisoesPendentes() {
  const container = document.getElementById("container-dias");
  const dias = container.querySelectorAll("[data-dia]");
  dias.forEach((card, index) => {
    const conteudo = conteudos[index]?.toLowerCase() || "";
    const revisao = ["revisão 7d", "revisão 14d", "revisão 21d"];
    const concluido = localStorage.getItem(`dia-${index + 1}`) === "true";

    const ehRevisao = revisao.some(r => conteudo.includes(r));
    if (ehRevisao && !concluido) {
      card.classList.remove("hidden");
    } else {
      card.classList.add("hidden");
    }
  });
}

function resetarFiltro() {
  const container = document.getElementById("container-dias");
  const dias = container.querySelectorAll("[data-dia]");
  dias.forEach(card => card.classList.remove("hidden"));
}
</script>

<script>
function destacarSimulados() {
  const simulados = [7, 14, 21, 28, 35, 42, 49, 56];
  simulados.forEach(dia => {
    const card = document.querySelector(`[data-dia='${dia}']`);
    if (card) {
      card.classList.add("dia-simulado");
      const titulo = card.querySelector("span");
      if (titulo && !titulo.textContent.includes("📝")) {
        titulo.textContent = `📝 Simulado • Dia ${dia}`;
      }
    }
  });
}

window.addEventListener("load", destacarSimulados);
</script>


</body>

</html>
